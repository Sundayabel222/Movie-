<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Discovery</title>
    <link rel="stylesheet" href="Main-Cards.css">
</head>
<body>

    <!-- Trending Movies Section -->
    <div class="section-container">
        <div class="section-header">
            <div class="section-title-group">
                <div class="category">Discover</div>
                <h2>Trending Movies</h2>
            </div>
            <a href="#" class="view-all">View All →</a>
        </div>
        <div class="movie-row" id="trending-row">
            <!-- Trending Cards Will Be Put Inside -->
        </div>
    </div>

    <!-- Top Rated Movies Section -->
    <div class="section-container">
        <div class="section-header">
            <div class="section-title-group">
                <div class="category">Best of the Best</div>
                <h2>Top Rated Movies</h2>
            </div>
            <a href="#" class="view-all">View All →</a>
        </div>
        <div class="movie-row" id="top-rated-row">
            <!-- Top Rated Cards Will Be Put Inside -->
        </div>
    </div>

    <!-- Upcoming Movies Section -->
    <div class="section-container">
        <div class="section-header">
            <div class="section-title-group">
                <div class="category">Coming Soon</div>
                <h2>Upcoming Movies</h2>
            </div>
            <a href="#" class="view-all">View All →</a>
        </div>
        <div class="movie-row" id="upcoming-row">
            <!-- Upcoming Cards Will Be Put Inside -->
        </div>
    </div>

    <script src="Main-Cards.js"></script>
</body>
</html>
